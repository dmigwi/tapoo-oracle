name: Deploy Pages Manually

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@v2
        with:
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Before the build, not after: this reports the path the site will be served from, and the build
      # has to know it. A project site lives under /<repo>/, and Observable writes that into every page
      # as <base href>. With the default "/" every relative asset on a shared report's page - which is
      # 404.html served one segment deeper, at /r/<token> - resolves outside the site and 404s.
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build the site
        # base_path is "" for a user or organisation site, which falls back to the domain root.
        env:
          ORACLE_SITE_BASE: ${{ steps.pages.outputs.base_path }}
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs:
      - build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
